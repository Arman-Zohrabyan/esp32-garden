; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; min_spiffs partition scheme: app0 = 1920 KB instead of 1280 KB with default.
; The firmware already took 76% with default; with ArduinoJson and the server
; communication logic there would be no room left. SPIFFS shrinks to 128 KB, but it isn't
; used. NVS stays at 0x9000 with size 0x5000, as in default,
; so the saved Wi-Fi survives the scheme change.
board_build.partitions = min_spiffs.csv

; Version is pinned (no ^): the build must be reproducible on another
; machine. ArduinoJson 7 manages the document size itself; in version 6
; the size was set manually and underestimating it silently truncated the JSON.
lib_deps = bblanchon/ArduinoJson@7.0.4

; FW_VERSION goes to /devices/register and to the boot log.
build_flags = -DFW_VERSION=\"0.4.0\"

; esp32_exception_decoder decodes addresses in panics into function names;
; when debugging deep sleep and heap usage this saves hours.
monitor_filters = esp32_exception_decoder, time
